name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exharness
          POSTGRES_PASSWORD: exharness
          POSTGRES_DB: exharness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exharness -d exharness_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EXHARNESS_TEST_PG_URL: postgres://exharness:exharness@127.0.0.1:5432/exharness_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release check (lint, format, build, typecheck, test, coverage)
        run: pnpm release:check
