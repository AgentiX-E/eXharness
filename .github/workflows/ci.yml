name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXHARNESS_TEST_PG_URL: postgres://exharness:exharness@127.0.0.1:5432/exharness_test
      # Optional live-integration keys. When these secrets are configured on the
      # repository, the live LLM/embedding tests run against the real endpoints;
      # otherwise they are skipped (empty values) and the rest of the suite
      # remains fully green.
      EXHARNESS_LLM_API_KEY: ${{ secrets.EXHARNESS_LLM_API_KEY }}
      EXHARNESS_EMBEDDING_API_KEY: ${{ secrets.EXHARNESS_EMBEDDING_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision PostgreSQL (install + start + database)
        run: sudo bash scripts/ensure-postgres.sh

      - name: Release check (lint, format, build, typecheck, test, coverage)
        run: pnpm release:check
